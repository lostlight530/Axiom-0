name: GPT Native 2026-11-09 Plasma pinned verification
on:
  push:
    branches:
      - gpt-native/plasma-daily-20261109
permissions:
  contents: read
jobs:
  plasma-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fresh exact pinned main checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 288e842ea415978cc699001ec9806893f0dbb507
          persist-credentials: false
      - name: Record checkout, Python and clean working tree
        run: |
          git rev-parse HEAD
          python3 --version
          git status --porcelain
      - name: A2 required numeric KL scanner
        run: python3 scan_kl_divergence.py
      - name: A2 required axiom document topology scanner
        run: python3 scan_consistency.py
      - name: A3 bounded 100 fixed-reference executions
        run: |
          python3 - <<'PY'
          import json,sys,subprocess,time,hashlib,pathlib
          p=pathlib.Path("CODE/nexus_core.py")
          print("CODE_SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          start=time.monotonic()
          failed=[]
          sample=None
          for i in range(100):
              c=subprocess.run([sys.executable,str(p)],capture_output=True,text=True,timeout=25)
              if sample is None:
                  sample={"stdout":c.stdout[:800],"stderr":c.stderr[:400],"exit":c.returncode}
              if c.returncode!=0:
                  failed.append({"index":i,"exit":c.returncode,"stdout":c.stdout[-200:],"stderr":c.stderr[-200:]})
          print("A3_EVIDENCE",json.dumps({"executions":100,"pass":100-len(failed),"fail":len(failed),"failed_cases":failed,"seconds":round(time.monotonic()-start,3),"sample":sample}))
          if failed: sys.exit(1)
          PY
      - name: Native tests at same pinned revision
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: A4 repository index read-only preflight
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths=["INDEX.md","PATCH_INDEX.md","ADR/INDEX.md","METHODOLOGY/INDEX.md"]
          print("A4_INDEX_EVIDENCE",json.dumps({x:{"present":pathlib.Path(x).is_file(),"length":len(pathlib.Path(x).read_text(encoding="utf-8")) if pathlib.Path(x).is_file() else None} for x in paths}))
          assert all(pathlib.Path(p).is_file() for p in paths)
          status=subprocess.check_output(["git","status","--porcelain"],text=True)
          print("WORKTREE_STATUS",repr(status))
          assert not status
          PY
