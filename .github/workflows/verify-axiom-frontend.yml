name: Verify Axiom frozen frontend

on:
  pull_request:
    paths:
      - 'FRONTEND/**'
      - '.github/workflows/verify-axiom-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'FRONTEND/**'
      - '.github/workflows/verify-axiom-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-frontend-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-contract:
    name: frontend-build-and-frozen-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: FRONTEND
        run: npm ci
      - name: Lint checked-in frontend
        working-directory: FRONTEND
        run: npm run lint
      - name: Typecheck and produce frozen snapshot bundle
        working-directory: FRONTEND
        run: npm run build
      - name: Verify frozen data and UI readout via actual SSR module
        working-directory: FRONTEND
        run: node --test tests/final-snapshot.test.mjs

      - name: Browser chart paint and repository interaction (Chrome desktop/mobile)
        working-directory: FRONTEND
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "Chromium browser is required for chart UI verification" >&2; exit 1; fi
          export CHROME_BIN
          npm run preview -- --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/axiom-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node tests/browser-chart-smoke.mjs
