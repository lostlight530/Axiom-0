name: Temporary 2026-11-06 Plasma Native Verification
on:
  push:
    branches: [independent/20261106-plasma-native-blocked-gpt6]
permissions:
  contents: read
jobs:
  plasma-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fresh checkout of exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 7d433b968101a3344f74130390e3509b15dcae35
          clean: true
          persist-credentials: false
          fetch-depth: 1
      - name: Record run provenance
        run: |
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "PYTHON=$(python3 --version)"
          echo "WORKTREE_CLEAN=$(test -z "$(git status --porcelain)" && echo true || echo false)"
          sha256sum scan_kl_divergence.py scan_consistency.py CODE/nexus_core.py
      - name: A2 gate 1 KL numeric scan
        run: python3 scan_kl_divergence.py
      - name: A2 gate 2 structural consistency scan
        run: python3 scan_consistency.py
      - name: A3 bounded 100-process stress
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, sys, time
          n = 100
          failures = []
          results = []
          start = time.perf_counter()
          for index in range(n):
              proc = subprocess.run([sys.executable, "CODE/nexus_core.py"], capture_output=True, text=True, timeout=20)
              try:
                  parsed = json.loads(proc.stdout)
                  valid = (proc.returncode == 0 and isinstance(parsed.get("events"), list)
                           and len(parsed["events"]) == 10
                           and all(row["status"] == "completed" for row in parsed["events"])
                           and parsed["state"]["coherence"]["kl_nats"] <= parsed["state"]["coherence"]["limit"])
              except (ValueError, KeyError, TypeError):
                  valid = False
              if not valid:
                  failures.append({"index": index, "return_code": proc.returncode,
                                   "stdout": proc.stdout[:1000], "stderr": proc.stderr[:1000]})
              else:
                  results.append(parsed["state"]["coherence"]["kl_nats"])
          elapsed = time.perf_counter() - start
          digest = hashlib.sha256(open("CODE/nexus_core.py", "rb").read()).hexdigest()
          print("PLASMA_A3_EVIDENCE=" + json.dumps({
              "target": "CODE/nexus_core.py", "process_invocations": n,
              "successful": n - len(failures), "failed": len(failures),
              "failed_indices": [f["index"] for f in failures],
              "mean_invocation_ms": round(elapsed / n * 1000, 3),
              "source_sha256": digest, "observed_kl_nats": sorted(set(results)),
              "limitations": "fixed default input; fresh isolated processes; not production or indefinite invariance",
              "failures": failures[:5]
          }, sort_keys=True))
          if failures: raise SystemExit(1)
          PY
      - name: Native repository unit tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: A4 document navigation read-only preflight
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          checks = {}
          for index in ("INDEX.md", "PATCH_INDEX.md"):
              text = (root/index).read_text(encoding="utf-8")
              links = re.findall(r"\]\(([^)#]+)(?:#[^)]*)?\)", text)
              local = [link for link in links if not re.match(r"^[a-z][a-z0-9+.-]*:", link, re.I)]
              missing = [link for link in local if not (root/index).parent.joinpath(link).exists()]
              checks[index] = {"links": len(local), "missing": missing[:20]}
              if missing: raise SystemExit(f"invalid {index} links: {missing[:20]}")
          print("PLASMA_A4_READONLY_PREFLIGHT=" + json.dumps(checks, sort_keys=True))
          PY
      - name: Final no-write verification
        run: |
          git status --short
          test -z "$(git status --porcelain)"
