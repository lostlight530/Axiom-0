name: temporary-plasma-native-20261111
on:
  push:
    branches:
      - native/2026-11-11-plasma-recovery
permissions:
  contents: read
jobs:
  plasma-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned main
        uses: actions/checkout@v4
        with:
          ref: 575f7bf4e4dfa66f44bb3c8723d9d933c6b58b7e
          persist-credentials: false
      - name: A2 KL formal gate
        run: python3 scan_kl_divergence.py
      - name: A2 document topology formal gate
        run: python3 scan_consistency.py
      - name: A3 fixed 100 real subprocess executions
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,sys,time
          from pathlib import Path
          program=Path("CODE/nexus_core.py")
          digest=hashlib.sha256(program.read_bytes()).hexdigest()
          t=time.monotonic()
          failures=[]
          sample=None
          output_digests=[]
          for i in range(100):
              p=subprocess.run([sys.executable,str(program)],capture_output=True,text=True,timeout=25)
              output_digests.append(hashlib.sha256((p.stdout+"\n"+p.stderr).encode()).hexdigest())
              if sample is None: sample=(p.stdout or "")[:500]
              if p.returncode: failures.append({"iteration":i+1,"code":p.returncode,"stderr":p.stderr[-400:]})
          result={"executions":100,"pass":100-len(failures),"fail":len(failures),"failed_cases":failures,"seconds":round(time.monotonic()-t,3),"program_sha256":digest,"unique_output_digests":len(set(output_digests)),"scope":"fixed default authorized_request_v2 only"}
          print("A3_EVIDENCE="+json.dumps(result,sort_keys=True))
          print("A3_SAMPLE="+repr(sample))
          if failures: raise SystemExit(1)
          PY
      - name: Native unit tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: A4 read-only indexes and clean source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          paths=["INDEX.md","PATCH_INDEX.md","ADR/INDEX.md","METHODOLOGY/INDEX.md"]
          result={x:{"exists":Path(x).is_file(),"characters":len(Path(x).read_text(encoding="utf-8")) if Path(x).is_file() else None} for x in paths}
          print("A4_EVIDENCE="+json.dumps(result,sort_keys=True))
          if not all(x["exists"] for x in result.values()): raise SystemExit(1)
          dirty=subprocess.run(["git","status","--porcelain"],capture_output=True,text=True,check=True).stdout
          print("A4_GIT_STATUS="+repr(dirty))
          if dirty: raise SystemExit(1)
          PY
