name: GPT Native 2026-11-08 Plasma pinned execution
on:
  push:
    branches:
      - gpt-native/2026-11-08-plasma-a1-a4
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  plasma-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2ec14832badc82c1ae4ab00ada2d4970bb537ea7
          persist-credentials: false
          fetch-depth: 0
      - name: Exact revision and environment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          git status --porcelain
      - name: A2 KL contract (formal first gate)
        run: |
          set -euo pipefail
          python3 scan_kl_divergence.py
      - name: A2 structural contract (formal second gate)
        run: |
          set -euo pipefail
          python3 scan_consistency.py
      - name: A3 bounded fixed-reference execution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys, pathlib, hashlib, time
          script=pathlib.Path("CODE/nexus_core.py")
          started=time.monotonic()
          ok=0
          failures=[]
          representative=None
          for i in range(100):
              p=subprocess.run([sys.executable,str(script)],capture_output=True,text=True,timeout=25)
              if p.returncode==0:
                  ok+=1
                  if representative is None: representative=p.stdout[:600]
              else: failures.append({"n":i,"exit":p.returncode,"stdout":p.stdout[:200],"stderr":p.stderr[:300]})
          print("A3_EVIDENCE",json.dumps({"pinned_main":"2ec14832badc82c1ae4ab00ada2d4970bb537ea7","code_sha256":hashlib.sha256(script.read_bytes()).hexdigest(),"executions":100,"pass":ok,"fail":len(failures),"failed_cases":failures,"representative_stdout":representative,"elapsed_sec":round(time.monotonic()-started,3)},ensure_ascii=False))
          if failures: sys.exit(1)
          PY
      - name: Native unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: A4 read-only topology/index preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('INDEX.md','PATCH_INDEX.md'):
              data=Path(name).read_text()
              print("INDEX_READ",name,len(data))
          PY
          test -z "$(git status --porcelain)"
