name: GPT Native 2026-11-07 Plasma native evidence
on:
  push:
    branches:
      - gpt-native/2026-11-07-plasma-a1-a4
permissions:
  contents: read
jobs:
  plasma-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gpt-native/2026-11-07-plasma-a1-a4
          persist-credentials: false
          fetch-depth: 0
      - name: Native source revision and environment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          git status --porcelain
      - name: Formal KL scan
        run: |
          set -euo pipefail
          python3 scan_kl_divergence.py
      - name: Formal consistency scan
        run: |
          set -euo pipefail
          python3 scan_consistency.py
      - name: Bounded 100 reference executions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,sys,time,hashlib,pathlib
          script=pathlib.Path("CODE/nexus_core.py")
          start=time.monotonic()
          good=0
          bad=[]
          representative=None
          for i in range(100):
              p=subprocess.run([sys.executable,str(script)],capture_output=True,text=True,timeout=25)
              if p.returncode==0:
                  good+=1
                  if representative is None: representative=p.stdout[:600]
              else:bad.append({"i":i,"exit":p.returncode,"stderr":p.stderr[:300]})
          print("A3_EVIDENCE",json.dumps({"revision":"aa1c692c10a371e7815034bcc81f05b644bf6444","sha256":hashlib.sha256(script.read_bytes()).hexdigest(),"calls":100,"successful":good,"failed":len(bad),"failed_cases":bad,"representative_stdout":representative,"elapsed_s":round(time.monotonic()-start,3)},ensure_ascii=False))
          if bad:sys.exit(1)
          PY
      - name: Native Python tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: Index preflight and no-write verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for n in ('INDEX.md','PATCH_INDEX.md'):
              s=Path(n).read_text()
              print("INDEX_PRESENT",n,len(s))
          PY
          test -z "$(git status --porcelain)"

      - name: Validate branch manifest and both index links
        run: |
          set -euo pipefail
          python3 validate_research_record.py RESEARCH/daily/2026-11-07-pipeline-manifest.md
          python3 - <<'PY'
          from pathlib import Path
          target="RESEARCH/daily/2026-11-07-pipeline-manifest.md"
          assert Path(target).is_file(), target
          for name in ("INDEX.md","PATCH_INDEX.md"):
              content=Path(name).read_text()
              count=content.count(f"]({target})")
              print("A4_BRANCH_INDEX", name, count)
              assert count==1,(name,count)
          PY
          git merge-base --is-ancestor aa1c692c10a371e7815034bcc81f05b644bf6444 HEAD
          python3 scope_guard.py --base-ref aa1c692c10a371e7815034bcc81f05b644bf6444 --allow-file RESEARCH/daily/2026-11-07-pipeline-manifest.md --allow-file INDEX.md --allow-file PATCH_INDEX.md
