name: Verify Axiom contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q CODE tests *.py
      - name: Protected-path gate
        if: github.event_name == 'pull_request'
        env:
          APPROVE_README: ${{ contains(github.event.pull_request.labels.*.name, 'scope:approved-readme') }}
          APPROVE_DEPENDENCIES: ${{ contains(github.event.pull_request.labels.*.name, 'scope:approved-dependencies') }}
        shell: bash
        run: |
          args=(--base-ref "${{ github.event.pull_request.base.sha }}")
          if [[ "$APPROVE_README" == "true" ]]; then
            args+=(--allow-file "README.md")
          fi
          if [[ "$APPROVE_DEPENDENCIES" == "true" ]]; then
            args+=(--allow-file "FRONTEND/package.json")
            args+=(--allow-file "FRONTEND/package-lock.json")
          fi
          python scope_guard.py "${args[@]}"
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Historical entrypoint checks
        run: |
          python code_compliance.py
          python scan_consistency.py
          python scan_kl_divergence.py
          python parallel_test.py
          python test_complexity.py
          python test_entropy_spike.py
          python test_json_dumps.py
          python test_metrics_json.py
          python datetime_test.py
          python str_e_test.py
          bash test_100.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - name: Install frontend dependencies
        working-directory: FRONTEND
        run: npm ci
      - name: Lint frontend
        working-directory: FRONTEND
        run: npm run lint
      - name: Build frontend
        working-directory: FRONTEND
        run: npm run build
