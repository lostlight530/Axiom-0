schema_version: "1.0"
id: axiom-contract-verification
enabled: false
owner: repository-maintainers
trigger:
  kind: cron
  expression: "17 3 * * 1"
  timezone: UTC
execution:
  command:
    - python
    - -m
    - unittest
    - discover
    - -s
    - tests
    - -v
  timeout_seconds: 600
  concurrency_group: axiom-contract-verification
  cancel_in_progress: false
permissions:
  repository_contents: read
artifacts:
  - kind: test-summary
    format: text
    retention_days: 14
failure:
  max_attempts: 2
  backoff_seconds: 60
  notify_owner: true